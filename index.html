<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibePlayer - Music Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <header class="header">
            <div class="logo">
                <div class="logo-icon">
                    <i class="fa-solid fa-headphones"></i>
                </div>
                <div>
                    <h2>VibePlayer</h2>
                    <span>Music for every mood</span>
                </div>
            </div>

            <div class="header-buttons">
                <button id="themeBtn" title="Change Theme">
                    <i class="fa-solid fa-sun"></i>
                </button>
                <button id="favoriteListBtn" title="Show Favorites">
                    <i class="fa-solid fa-heart"></i>
                </button>
            </div>
        </header>

        <main class="main-container">

            
            <section class="player-card">

                <div class="album-area">
                    <div id="albumCover" class="album-cover">
                        <i class="fa-solid fa-music"></i>
                    </div>

                    <div class="visualizer" id="visualizer">
                        <span></span><span></span><span></span><span></span><span></span>
                        <span></span><span></span><span></span><span></span><span></span>
                    </div>
                </div>

                <div class="song-info">
                    <div>
                        <p class="now-playing">NOW PLAYING</p>
                        <h1 id="songTitle">Dreams</h1>
                        <p id="artist">Unknown Artist</p>
                        <span id="songCategory" class="category-badge"></span>
                    </div>

                    <div class="song-actions">
                        <button id="playlistBtn" class="icon-btn" title="Add to My Playlist">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                        <button id="favoriteBtn" class="icon-btn favorite-btn" title="Add to Favorites">
                            <i class="fa-regular fa-heart"></i>
                        </button>
                    </div>
                </div>

                <div class="progress-area">
                    <div class="time-info">
                        <span id="currentTime">0:00</span>
                        <span id="duration">0:00</span>
                    </div>
                    <input type="range" id="progress" min="0" max="100" value="0">
                </div>

                <div class="controls">
                    <button id="shuffleBtn" title="Shuffle">
                        <i class="fa-solid fa-shuffle"></i>
                    </button>
                    <button id="previousBtn" title="Previous">
                        <i class="fa-solid fa-backward-step"></i>
                    </button>
                    <button id="playBtn" class="play-btn" title="Play">
                        <i class="fa-solid fa-play"></i>
                    </button>
                    <button id="nextBtn" title="Next">
                        <i class="fa-solid fa-forward-step"></i>
                    </button>
                    <button id="repeatBtn" title="Repeat">
                        <i class="fa-solid fa-repeat"></i>
                    </button>
                </div>

                <div class="volume-area">
                    <button id="muteBtn" title="Mute">
                        <i class="fa-solid fa-volume-high"></i>
                    </button>
                    <input type="range" id="volume" min="0" max="1" step="0.01" value="0.7">
                    <span id="volumeValue">70%</span>
                </div>

                <div class="extra-controls">
                    <label for="speed">Playback Speed</label>
                    <select id="speed">
                        <option value="0.5">0.5x</option>
                        <option value="0.75">0.75x</option>
                        <option value="1" selected>1x</option>
                        <option value="1.25">1.25x</option>
                        <option value="1.5">1.5x</option>
                        <option value="2">2x</option>
                    </select>
                </div>

            </section>

            
            <section class="playlist-card">

                <div class="playlist-heading">
                    <div>
                        <p>YOUR MUSIC</p>
                        <h2 id="playlistTitle">Playlist</h2>
                    </div>
                    <span id="songCount">6 Songs</span>
                </div>

                <!-- Tabs: All / Favorites / My Playlist -->
                <div class="tabs" id="tabs">
                    <button class="tab active" data-view="all">
                        <i class="fa-solid fa-list"></i> All Songs
                    </button>
                    <button class="tab" data-view="favorites">
                        <i class="fa-solid fa-heart"></i> Favorites
                    </button>
                    <button class="tab" data-view="playlist">
                        <i class="fa-solid fa-folder-plus"></i> My Playlist
                    </button>
                </div>

                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="Search songs, artists or category...">
                </div>

                <!-- Category filter chips (created by JavaScript) -->
                <div class="categories" id="categories"></div>

                <div id="songList" class="song-list"></div>

                <div id="emptyMessage" class="empty-message">
                    <i class="fa-solid fa-music"></i>
                    <p id="emptyText">No songs found</p>
                </div>

            </section>

        </main>

        <footer>
            <p><i class="fa-solid fa-music"></i> VibePlayer</p>
            <span>Made with HTML • CSS • JavaScript</span>
        </footer>

    </div>

    <audio id="audio"></audio>

    <script src="script.js"></script>

</body>

</html>
